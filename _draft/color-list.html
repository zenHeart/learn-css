<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Document</title>
        <style>
            .container {
                height: 50px;
                line-height: 50px;
                text-align: center;
                display: flex;
                flex-wrap: wrap;
            }
            .container > div {
                flex: 1 1 200px;
                border: 1px solid #000;
            }
        </style>
    </head>
    <body>
        <h1>保存一组颜色列表</h1>
        <div class="container">
            <div style="background:rgba(233,171,88,.5)">
                rgba(233,171,88,.5)
            </div>
            <div style="background: #cfc;">
                #cfc
            </div>
            <div style="background:#fdd;">
                #fdd
            </div>
            <div style="background:#ffc;">
                #ffc
            </div>
            <div style="background:#ddddff;">
                #ddddff
            </div>
        </div>
    </body>
</html>
