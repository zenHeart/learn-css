<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>flex 典型布局</title>
        <style>
            .flex {
                display: flex;
                width: 200px;
                height: 200px;
                align-items: center;
                justify-content: flex-start;
                border: 1px solid #000;
            }
            select[data-hor='flex-start'] ~ .flex {
                justify-content: flex-start;
            }
            select[data-hor='center'] ~ .flex {
                justify-content: center;
            }
            select[data-hor='flex-end'] ~ .flex {
                justify-content: flex-end;
            }
            select[data-ver='flex-start'] ~ .flex {
                align-items: flex-start;
            }
            select[data-ver='center'] ~ .flex {
                align-items: center;
            }
            select[data-ver='flex-end'] ~ .flex {
                align-items: flex-end;
            }
        </style>
    </head>
    <body>
        <label for="horAlign">水平对齐</label>
        <select onchange="this.dataset.hor = this.value" name="horAlign">
            <option value="flex-start" selected>left</option>
            <option value="center">center</option>
            <option value="flex-end">right</option>
        </select>
        <label for="verAlign">垂直对齐</label>
        <select onchange="this.dataset.ver = this.value" name="horAlign">
            <option value="flex-start">top</option>
            <option value="middle" selected>middle</option>
            <option value="flex-end">bottom</option>
        </select>
        <h1>当行文本图像对齐</h1>
        <div class="flex">
            <img src="http://dummyimage.com/50x50/4A7BF" alt="img" />
            <span style="padding-left:10px">text</span>
        </div>
    </body>
</html>
