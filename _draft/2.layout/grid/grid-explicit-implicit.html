<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>显示和隐式栅格</title>
        <style>
            #grid {
                display: grid;
                grid-template-columns: 50px;
                grid-template-rows: 50px;

                grid-auto-columns: 100px;
                grid-auto-rows: 100px;
            }
            #grid > div {
                background: #ffc07e;
                border: 2px solid #c08b7d;
                opacity: 0.7;
            }
            #A {
                grid-column: 1;
                grid-row: 1;
            }
            #B {
                grid-column: 2;
                grid-row: 1;
            }
            #C {
                grid-column: 1;
                grid-row: 2;
            }
            #D {
                grid-column: 2;
                grid-row: 2;
            }
        </style>
    </head>
    <body>
        <div id="grid">
            <div id="A">A</div>
            <div id="B">B</div>
            <div id="C">C</div>
            <div id="D">D</div>
        </div>
    </body>
</html>
