<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>counter</title>
    <style>
      ul {
        counter-reset: list;
        list-style: none;
      }
      li::before {
        counter-increment: list;
        content: counters(list, '.', lower-latin);
      }
    </style>
  </head>
  <body>
    <p>该示例 演示 counters 的使用</p>
    <article>
      <ul>
        <li>1</li>
        <li>2</li>
        <li>
          <ul>
            <li>1</li>
            <li>2</li>
          </ul>
        </li>
      </ul>
    </article>
  </body>
</html>
