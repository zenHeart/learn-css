<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
  </head>
  <style>
    .round-combine {
      position: relative;
      padding: 0 10px;
      background: linear-gradient(#4478f3, #3c82fa);
      border-radius: 0 13px 0 0;
    }
    .round-combine::before {
      position: absolute;
      background: orange;
      left: -5px;
      content: '';
      display: block;
      width: 4px;
      height: 26px;
      border-radius: 4px 0 0 4px;
    }
    .round-combine::after {
      position: absolute;
      left: 0px;
      content: 'What';
    }
    span {
      display: inline-block;
      line-height: 26px;
    }
  </style>
  <body>
    <h1>圆角梯形</h1>
    <div>
      <span class="round-combine">测试文字</span>
    </div>
  </body>
</html>
