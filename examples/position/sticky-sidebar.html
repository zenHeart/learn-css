<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <style>
      .parent {
        width: 800px;
        height: 2000px;
        background: cyan;
        margin-left: 100px;
        position: relative;
      }
      .sidebar {
        position: sticky;
        top: 50%;
        margin-left: -40px;
        width: 30px;
        height: 100px;
        background: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>实现粘性边栏布局</h1>
    <div class="parent">
      <div class="sidebar">边栏</div>
    </div>
  </body>
</html>
