<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subgrid 行对齐演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #f0f6fc; }
    .desc { font-size: 14px; color: #8b949e; margin-bottom: 24px; }
    .container { max-width: 600px; margin: 0 auto; }

    .form-grid {
      display: grid;
      grid-template-rows: repeat(4, auto);
      gap: 16px;
      padding: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }

    .form-row {
      display: grid;
      /* 继承父网格的行轨道 */
      grid-template-rows: subgrid;
      gap: 8px;
    }

    .form-row label {
      font-size: 14px;
      color: #f0f6fc;
      font-weight: 500;
    }

    .form-row input, .form-row textarea {
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 14px;
    }

    .form-row input:focus, .form-row textarea:focus {
      outline: none;
      border-color: #388bfd;
    }

    .form-row textarea {
      resize: vertical;
      min-height: 60px;
    }

    /* 使用 subgrid 实现标签对齐 */
    .field-group {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 16px;
      padding: 12px;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
    }

    .field-group .label {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #f0f6fc;
    }

    .field-group .input {
      display: grid;
      grid-template-columns: subgrid;
    }

    .field-group input {
      width: 100%;
    }

    .code {
      margin-top: 20px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      color: #79c0ff;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, auto);
      gap: 16px;
      padding: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-top: 24px;
    }

    .form-item {
      display: grid;
      gap: 8px;
    }

    .form-item.full-width {
      grid-column: 1 / -1;
    }

    .form-item label {
      font-size: 14px;
      color: #f0f6fc;
    }

    .form-item input, .form-item textarea {
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Subgrid 行对齐</h1>
    <p class="desc">表单布局中使用 subgrid 实现标签与输入框完美对齐</p>

    <div class="form-grid-2">
      <div class="form-item">
        <label>姓名</label>
        <input type="text" placeholder="请输入姓名">
      </div>
      <div class="form-item">
        <label>邮箱</label>
        <input type="email" placeholder="请输入邮箱">
      </div>
      <div class="form-item">
        <label>手机号</label>
        <input type="tel" placeholder="请输入手机号">
      </div>
      <div class="form-item">
        <label>公司</label>
        <input type="text" placeholder="请输入公司名称">
      </div>
      <div class="form-item full-width">
        <label>备注</label>
        <textarea placeholder="请输入备注信息"></textarea>
      </div>
    </div>

    <div class="code">/* 父网格定义行结构 */
.form-grid {
  display: grid;
  grid-template-rows: repeat(4, auto);
  gap: 16px;
}

/* 表单项使用 subgrid 继承行轨道 */
.form-item {
  display: grid;
  gap: 8px;
}

/* 标签和输入框会自动对齐到父网格行 */</div>
  </div>
</body>
</html>
