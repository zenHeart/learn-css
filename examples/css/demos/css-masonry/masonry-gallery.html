<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Masonry - 图片画廊实战</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #f0f6fc; }
    .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 24px; }
    .container { max-width: 960px; margin: 0 auto; }
    .section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .section h2 { font-size: 16px; color: #f0f6fc; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    .info { font-size: 12px; color: #8b949e; padding: 12px; background: #0d1117; border-radius: 4px; line-height: 1.6; margin-bottom: 12px; }
    .demo-area { background: #21262d; border-radius: 6px; padding: 16px; min-height: 300px; }
    .grid { display: grid-lanes; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .photo { border-radius: 8px; overflow: hidden; background: #30363d; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .code-block { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 12px; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; overflow-x: auto; color: #79c0ff; margin-top: 12px; white-space: pre; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
    .badge-experimental { background: #f0883e; color: #0d1117; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Masonry - 图片画廊实战 <span class="badge badge-experimental">实验性</span></h1>
    <p class="subtitle">模拟 Pinterest 风格的图片瀑布流布局</p>

    <div class="section">
      <h2>图片画廊</h2>
      <div class="info">使用 masonry 布局实现高度不一的图片自适应排列，每张图片比例不同但紧密衔接</div>
      <div class="demo-area">
        <div class="grid" id="gallery"></div>
      </div>
      <div class="code-block">.gallery {
  display: grid-lanes;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}</div>
    </div>
  </div>

  <script>
    const photos = [
      { ratio: 0.75, color: '#58a6ff' },
      { ratio: 1.33, color: '#3fb950' },
      { ratio: 1, color: '#f0883e' },
      { ratio: 0.67, color: '#a371f7' },
      { ratio: 1.5, color: '#db6d28' },
      { ratio: 0.8, color: '#8957e5' },
      { ratio: 1.25, color: '#2ea043' },
      { ratio: 0.7, color: '#0969da' },
      { ratio: 1.4, color: '#bf8700' },
      { ratio: 0.9, color: '#cf222e' },
      { ratio: 1.1, color: '#0550ae' },
      { ratio: 0.65, color: '#a371f7' },
    ];

    const gallery = document.getElementById('gallery');
    photos.forEach((photo, i) => {
      const div = document.createElement('div');
      div.className = 'photo';
      const height = Math.round(160 / photo.ratio);
      div.style.blockSize = height + 'px';

      const img = document.createElement('img');
      img.alt = 'Photo ' + (i + 1);
      img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="160" height="' + height + '"><rect fill="' + encodeURIComponent(photo.color) + '" width="160" height="' + height + '"/><text x="80" y="' + (height/2) + '" text-anchor="middle" dy=".3em" fill="white" font-family="sans-serif" font-size="12">' + (i + 1) + '</text></svg>';
      div.appendChild(img);
      gallery.appendChild(div);
    });
  </script>
</body>
</html>
