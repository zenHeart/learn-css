<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Masonry - 跨轨道元素</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #f0f6fc; }
    .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    .section { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .section h2 { font-size: 16px; color: #f0f6fc; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #30363d; }
    .info { font-size: 12px; color: #8b949e; padding: 12px; background: #0d1117; border-radius: 4px; line-height: 1.6; margin-bottom: 12px; }
    .demo-area { background: #21262d; border-radius: 6px; padding: 16px; min-height: 200px; }
    .grid { display: grid-lanes; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .item { background: linear-gradient(135deg, #a371f7, #8957e5); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; font-size: 14px; min-block-size: 60px; }
    .span-2 { grid-column-end: span 2; }
    .positioned { background: linear-gradient(135deg, #f0883e, #db6d28); padding: 1em; grid-column: 2 / 4; }
    .code-block { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 12px; font-family: 'SF Mono', Monaco, monospace; font-size: 12px; overflow-x: auto; color: #79c0ff; margin-top: 12px; white-space: pre; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
    .badge-experimental { background: #f0883e; color: #0d1117; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSS Masonry - 跨轨道元素 <span class="badge badge-experimental">实验性</span></h1>
    <p class="subtitle">使用 span 关键字让元素跨越多个轨道</p>

    <div class="section">
      <h2>跨两列的元素</h2>
      <div class="info">添加 <code>grid-column-end: span 2</code> 让元素占两列宽度</div>
      <div class="demo-area">
        <div class="grid" id="masonry-span">
          <div class="item">1</div>
          <div class="item span-2">2 (跨2列)</div>
          <div class="item">3</div>
          <div class="item">4</div>
          <div class="item span-2">5 (跨2列)</div>
          <div class="item">6</div>
          <div class="item">7</div>
          <div class="item">8</div>
          <div class="item">9</div>
          <div class="item">10</div>
          <div class="item">11</div>
        </div>
      </div>
      <div class="code-block">.span-2 {
  grid-column-end: span 2;
}</div>
    </div>

    <div class="section">
      <h2>定位到指定列</h2>
      <div class="info">使用 <code>grid-column: 2 / 4</code> 将元素固定定位到第 2-3 列，先于 masonry 排列放置</div>
      <div class="demo-area">
        <div class="grid" id="masonry-positioned">
          <div class="item">1</div>
          <div class="item">2</div>
          <div class="item">3</div>
          <div class="item">4</div>
          <div class="item positioned">定位元素<br/>col 2-4</div>
          <div class="item">5</div>
          <div class="item">6</div>
          <div class="item">7</div>
          <div class="item">8</div>
          <div class="item">9</div>
          <div class="item">10</div>
        </div>
      </div>
      <div class="code-block">.positioned {
  grid-column: 2 / 4;
}</div>
    </div>
  </div>

  <script>
    const itemSizes = ["2em", "3em", "1.6em", "4em", "3.2em", "3em", "4.5em", "1em", "3.5em", "2.8em", "2em"];
    const items = document.querySelectorAll(".item:not(.span-2):not(.positioned)");
    for (let i = 0; i < items.length; i++) {
      items[i].style.blockSize = itemSizes[i];
    }
  </script>
</body>
</html>
