<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        .normal,.abnormal,.block-abnormal p {
            border-bottom: 1px solid #000;
        }

        .normal strong {
            font-size: 1.5rem;
        }
        .abnormal strong {
            font-size: 1.5rem;
        }
        .block-abnormal strong {
            font-size: 1.5rem;
        }

        .normal span {
            font-size: 1rem;
        }
        .abnormal span {
            font-size: 1rem;
        }
        .block-abnormal span {
            font-size: 1rem;
        }

    </style>
</head>
<body>
<div class="normal">
    <h1>正常情况基线对齐</h1>
    <p><strong>前言</strong><span>说明文本</span></p>
</div>

<div class="abnormal">
    <h1>浮动导致 span 脱离行内,非基线对齐</h1>
    <p><strong>前言</strong><span style="float: right;">说明文本</span></p>
</div>

</body>
</html>
