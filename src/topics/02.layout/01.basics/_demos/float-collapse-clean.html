<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>浮动塌陷清除</title>
        <style>
            .container {
                border: 1px solid #000;
            }
            .clearfix::after {
                content: '';
                display: block;
                clear: both;
            }
            .children {
                float: left;
                padding: 10px;
            }
            .container-bfc {
                /* 该属性会生成新的 BFC */
                display: flow-root;
                border: 1px solid #000;
            }
        </style>
    </head>
    <body>
        <h1>采用 clear 属性清除浮动塌陷</h1>
        <div class="container clearfix">
            <img class="children" src="https://dummyimage.com/100x100/green" />
            <p>
                利用伪元素实现浮动的清除
            </p>
        </div>
        <h1>采用 BFC 实现浮动元素的清除</h1>
        <div class="container-bfc">
            <img class="children" src="https://dummyimage.com/100x100/green" />
            <p>
                利用伪元素实现浮动的清除
            </p>
        </div>
    </body>
    <script></script>
</html>
