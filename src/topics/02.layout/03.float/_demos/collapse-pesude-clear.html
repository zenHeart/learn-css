<style>
  article {
    border: 1px solid #000;
    width: 600px;
  }
  article img {
    float: left;
  }
  article p {
    background: yellow;
  }
  article::after {
    display: block;
    /* 注意为了兼容性这里是需要添加空格，
    避免有些浏览器在没有 content 时会忽略这个元素的问题 */
    content: ' ';
    clear: both;
  }

</style>
<article>
  <img src="https://dummyimage.com/200x200/000/fff&text=test" alt="测试图片" />
  <p>
    注意内容区域会在浮动元素之后排列,但是由于浮动不占据父容器空间, 所以该 p
    标签的对应的盒模型和浮动元素出现了重叠。同时父容器的高度也会塌陷。
  </p>
</article>
