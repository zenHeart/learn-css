<style>
  :root {
    --float: left;
  }
  article {
    width: 300px;
    border: 1px solid #000;
  }
  article img {
    float: var(--float);
    margin: 10px;
  }
</style>
<select id="float">
  <option value="left">左浮动</option>
  <option value="right">右浮动</option>
</select>
<article>
  <img src="https://dummyimage.com/100x100/000/fff&text=test" alt="测试图片" />
  Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae harum excepturi
  tenetur placeat fugiat officia rem? Asperiores alias temporibus harum? Odio
  praesentium iusto ex adipisci illum officiis quos consectetur eaque?
</article>
<script>
  const select = document.querySelector("#float");
  select.addEventListener("change", (e) => {
    document.documentElement.style.setProperty("--float", e.target.value);
  });
</script>
