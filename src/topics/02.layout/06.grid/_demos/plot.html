<style>
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 300px;
    height: 300px;
    border: 2px solid #8B5E3C; /* 土地边框色 */
    background: #E2C290; /* 农田背景色 */
    gap: 0;
  }
  .field-cell {
    background: #E2C290; /* 农田背景色 */
    border: 2px solid #8B5E3C; /* 田字格线色 */
    box-sizing: border-box;
    width: 100%;
    height: 100%;
  }
  body {
    background: #fffbe8;
  }
</style>

<div class="field-grid">
  <div class="field-cell"></div>
  <div class="field-cell"></div>
  <div class="field-cell"></div>
  <div class="field-cell"></div>
</div>
