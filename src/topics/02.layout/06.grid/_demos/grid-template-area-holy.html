    grid-template-rows: 100px 1fr 100px;
    height: 100vh;
  }
  header {
    grid-area: header;
    background: #ffb347;
    color: #fff;

    text-align: center;
  }
  nav {

    background: #ffd580;

    text-align: center;
  }
  main {
    grid-area: main;
    background: #fffbe7;
    color: #333;
    text-align: center;
  }
  aside {
    grid-area: aside;
    background: #ffe4b5;
    color: #7c5c2a;
    text-align: center;
  }
  footer {
    grid-area: footer;
    background: #ffb347;
    color: #fff;

    text-align: center;
  }

  <header>header</header>
  <nav>nav</nav>
