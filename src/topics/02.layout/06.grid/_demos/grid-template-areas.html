<style>
  .container {
    display: grid;
    grid-template-areas:
      "header header"
      "sidebar main";
    grid-template-columns: 120px 1fr;
    grid-template-rows: 60px 1fr;
    gap: 10px;
    height: 200px;
    border: 2px dashed #ccc;
  }
  .header {
    grid-area: header;
    background: #ffb347;
    text-align: center;
    line-height: 60px;
    font-weight: bold;
  }
  .sidebar {
    grid-area: sidebar;
    background: #ffd580;
    text-align: center;
    line-height: 130px;
  }
  .main {
    grid-area: main;
    background: #fffbe7;
    text-align: center;
    line-height: 130px;
  }
</style>

<div class="container">
  <div class="header">header</div>
  <div class="sidebar">sidebar</div>
  <div class="main">main</div>
</div>
