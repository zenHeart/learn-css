<style>
  .container {
    display: grid;
    grid-template-columns: 100px 1fr 100px;
    grid-template-rows: 50px calc(100vh - 100px) 50px;
    background: #f5f5f5;
  }
  header {
    grid-column: 1 / -1;
    background: #ffb347;
    color: #fff;
    font-weight: bold;
    text-align: center;
  }
  nav {
    grid-column: 1;
    grid-row: 2;
    background: #ffd580;
    color: #7c5c2a;
    text-align: center;
  }
  main {
    grid-column: 2;
    grid-row: 2;
    background: #fffbe7;
    color: #333;
    text-align: center;
  }
  aside {
    grid-column: 3;
    grid-row: 2;
    background: #ffe4b5;
    color: #7c5c2a;
    text-align: center;
  }
  footer {
    grid-column: 1 / -1;
    background: #ffb347;
    color: #fff;
    font-weight: bold;
    text-align: center;
  }
</style>

<div class="container">
  <header>header</header>
  <nav>nav</nav>
  <main>main</main>
  <aside>aside</aside>
  <footer>footer</footer>
</div>
