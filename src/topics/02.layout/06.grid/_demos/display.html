<!-- display grid -->
<style>
  .grid {
    display: grid;
    border: 1px solid red;
  }
  .inline-grid {
    display: inline-grid;
    border: 1px solid red;
  }
  .item {
    background-color: #f0f0f0;
    border: 1px solid #ccc;
    font-size: 16px;
  }
  * {
    margin: 0;
    padding: 0;
  }
</style>

<div>
  <strong>display grid</strong>
  <div class="grid">
    <div class="item">Item 1</div>
    <span class="item">Item 2</span>
    <strong class="item">Item 3</strong>
    <p class="item">Item 4</p>
  </div>
  <strong>display inline grid</strong>
  <div class="inline-grid">
    <div class="item">Item 1</div>
    <span class="item">Item 2</span>
    <strong class="item">Item 3</strong>
    <p class="item">Item 4</p>
  </div>
</div>
