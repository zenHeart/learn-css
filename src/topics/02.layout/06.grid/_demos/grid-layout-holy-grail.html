<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>grid 实现圣杯布局</title>
        <style>
            .container {
                display: grid;
                grid-template-columns: 100px repeat(2, 1fr) 100px;
                grid-template-rows: repeat(3, auto);
                text-align: center;
            }
            .header {
                grid-column: 1/5;
                grid-row: 1/2;
                height: 50px;
                background: #cfc;
            }
            .left-side {
                grid-column: 1/2;
                grid-row: 2/3;
                background: #fdd;
            }
            .content {
                grid-column: 2/4;
                grid-row: 2/3;
                height: 300px;
                background: #ffc;
            }
            .right-side {
                grid-column: 4/5;
                grid-row: 2/3;
                background: #ddddff;
            }
            .footer {
                grid-column: 1/5;
                height: 50px;
                background: rgba(233, 171, 88, 0.5);
            }
            .container > div {
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <h1>grid 圣杯布局</h1>
        <div class="container">
            <div class="header">头部</div>
            <div class="left-side">左边栏</div>
            <div class="content">内容区域</div>
            <div class="right-side">右边栏</div>
            <div class="footer">底部</div>
        </div>
    </body>
</html>
