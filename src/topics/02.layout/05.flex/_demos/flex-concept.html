<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <style>
    :root {
      --axis-border: 2px;
      --axis-out-length: 10px;
      --side-width: 10px;
    }

    .parent {
      position: relative;
      border: 1px solid #000;
      background-color: lightgray;
      display: flex;
      counter-reset: item-number;
      margin: 100px 200px
    }

    .main-start {
      position: relative;
    }

    .main-start::before {
      position: absolute;
      content: 'main-start';
      width: 100px;
      /* top: -2rem; */
    }

    .main-end {
      position: relative;
    }

    .main-end::after {
      width: 100%;
      position: absolute;
      content: 'main-end';
      width: 100px;
      /* top: -2rem; */
    }



    .item {
      padding: 10px;
      background-color: lightpink;
      border: 1px solid #000;
      margin: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 20%;
    }

    .item::before {
      counter-increment: item-number;
      content: counter(item-number);
    }

    .main-axis {
      line-height: 1rem;
      position: absolute;
      top: calc(50% - 1rem);
      left: 0;
      right: calc(-6 * var(--axis-out-length));
      border-bottom: 2px solid red;
      text-align: right;
      padding: 0 1rem;
    }

    .main-axis::before {
      display: inline-block;
      width: var(--side-width);
      height: var(--side-width);
      border-radius: 50%;
      position: absolute;
      content: "";
      top: calc(-0.5 * var(--side-width) + 1rem);
      left: calc(-0.5 * var(--side-width));
      box-shadow: inset 0 0 0 2px red;
    }

    .main-axis::after {
      content: "";
      position: absolute;
      border-top: var(--side-width) solid white;
      border-right: var(--side-width) solid white;
      border-bottom: var(--side-width) solid white;
      border-left: calc(1.2 *var(--side-width)) solid red;
      top: calc(-0.9 * var(--side-width) + 1rem);
      right: calc(-2 * var(--side-width));
      box-shadow: inset 0 0 0 2px red;
    }

    .reverse.main-axis {
      /* transform:  rotate(180deg); */

    }

    .cross-axis {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: calc(-4 * var(--axis-out-length));
      border-left: 2px solid red;
    }
  </style>

  <body>
    <div>
      <button>flex-direction: row;</button>
      <button>flex-direction: row-reverse;</button>
      <button>flex-direction: column;</button>
      <button>flex-direction: column-reverse;</button>
    </div>

    <div class="parent">
      <div class="main-axis reverse">主轴</div>
      <div class="cross-axis"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </body>
  <script>
    let btns = document.getElementsByTagName('button');
    let prentEl = document.getElementsByClassName('parent')[0];

    [...btns].forEach(el => {
      el.onclick = function (e) {
        prentEl.style.cssText = e.target.innerText;
      }
    })
  </script>

</html>
