<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>z-index 属性验证</title>
        <style>
            .container {
                width: 300px;
                height: 300px;
                position: relative;
                border: 1px solid #000;
            }
            .children1 {
                position: absolute;
                z-index: 1;
                width: 200px;
                height: 200px;
                border: 1px solid #000;
                background: gray;
            }
            .children2 {
                position: absolute;
                right: 0;
                z-index: 2;
                width: 200px;
                height: 200px;
                border: 1px solid #000;
                background: cyan;
            }
            .d1 {
                position: absolute;
                width: 50px;
                height: 150px;
                z-index: 3;
                background: green;
            }
            .d2 {
                position: absolute;
                width: 200px;
                height: 100px;
                z-index: 4;
                background: red;
            }
        </style>
    </head>

    <body>
        <h1>验证 z-index 属性</h1>
        <div class="container">
            <div class="children1">
                <div class="d1">子容器1-d1</div>
                <div class="d2">子容器1-d2</div>
            </div>
            <div class="children2">
                <div class="d1">子容器2-d1</div>
                <div class="d2">子容器2-d2</div>
            </div>
        </div>
    </body>
</html>
