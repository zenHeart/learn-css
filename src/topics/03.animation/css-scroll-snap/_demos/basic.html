<h3>基础示例：水平滚动吸附</h3>
<p>尝试水平滚动，下方卡片会自动吸附到最近的位置。</p>
<section class="carousel">
  <div class="slide slide-1">1</div>
  <div class="slide slide-2">2</div>
  <div class="slide slide-3">3</div>
  <div class="slide slide-4">4</div>
  <div class="slide slide-5">5</div>
</section>
<style>
  .carousel {
    display: flex;
    width: 100%;
    height: 200px;
    overflow-x: scroll;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    /* 平滑吸附动画 */
    scroll-behavior: smooth;
    /* 隐藏滚动条 */
    scrollbar-width: none;
    gap: 12px;
    padding: 0 20px;
    background: #f5f5f5;
    border-radius: 8px;
  }
  .carousel::-webkit-scrollbar {
    display: none;
  }
  .slide {
    flex: 0 0 80%;
    height: 100%;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #fff;
    scroll-snap-align: start;
  }
  .slide-1 { background: #ff6b6b; }
  .slide-2 { background: #4ecdc4; }
  .slide-3 { background: #45b7d1; }
  .slide-4 { background: #96ceb4; }
  .slide-5 { background: #dda0dd; }
</style>
