<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CSS 媒体查询演示</title>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
			margin: 2rem;
			line-height: 1.6;
		}
		
		.demo-container {
			max-width: 800px;
			margin: 0 auto;
		}
		
		.content {
			font-size: 16px;
			background: #f0f8ff;
			padding: 1rem;
			border-radius: 8px;
			margin: 1rem 0;
			transition: all 0.3s ease;
		}

		.status {
			background: #e8f5e8;
			border: 1px solid #4caf50;
			padding: 0.5rem;
			border-radius: 4px;
			margin: 1rem 0;
		}

		/* 媒体查询：小屏幕设备 */
		@media (max-width: 768px) {
			.content {
				border: 2px solid #ff6b6b;
				font-size: 18px;
				background: #ffe6e6;
			}
			
			.status {
				background: #ffe6e6;
				border-color: #ff6b6b;
			}
		}

		/* 媒体查询：超小屏幕设备 */
		@media (max-width: 480px) {
			.content {
				font-size: 20px;
				border-width: 3px;
				background: #ffcccc;
			}
		}

		button {
			background: #007bff;
			color: white;
			border: none;
			padding: 0.5rem 1rem;
			border-radius: 4px;
			cursor: pointer;
			margin: 0.5rem;
		}

		button:hover {
			background: #0056b3;
		}

		button:disabled {
			background: #ccc;
			cursor: not-allowed;
		}
	</style>
</head>
<body>
	<div class="demo-container">
		<h1>CSS 媒体查询演示</h1>
		<p>调整浏览器窗口大小来查看媒体查询效果：</p>
		
		<div class="content">
			这是一个响应式内容区域。当屏幕宽度小于 768px 时，样式会发生变化。
		</div>
		
		<div class="status" id="status">
			当前状态：正在监听媒体查询变化...
		</div>
		
		<div>
			<button onclick="startListening()">开始监听</button>
			<button onclick="stopListening()">停止监听</button>
		</div>
	</div>

	<script>
		let mql768 = null;
		let mql480 = null;
		
		function updateStatus() {
			const statusEl = document.getElementById('status');
			const width = window.innerWidth;
			
			if (width <= 480) {
				statusEl.textContent = `当前状态：超小屏幕模式 (宽度: ${width}px ≤ 480px)`;
			} else if (width <= 768) {
				statusEl.textContent = `当前状态：小屏幕模式 (宽度: ${width}px ≤ 768px)`;
			} else {
				statusEl.textContent = `当前状态：大屏幕模式 (宽度: ${width}px > 768px)`;
			}
		}
		
		function startListening() {
			// 监听 768px 断点
			mql768 = window.matchMedia("(max-width: 768px)");
			mql768.addEventListener('change', updateStatus);
			
			// 监听 480px 断点
			mql480 = window.matchMedia("(max-width: 480px)");
			mql480.addEventListener('change', updateStatus);
			
			updateStatus();
			console.log('开始监听媒体查询变化');
		}
		
		function stopListening() {
			if (mql768) {
				mql768.removeEventListener('change', updateStatus);
				mql768 = null;
			}
			if (mql480) {
				mql480.removeEventListener('change', updateStatus);
				mql480 = null;
			}
			
			document.getElementById('status').textContent = '监听已停止';
			console.log('停止监听媒体查询变化');
		}
		
		// 页面加载时自动开始监听
		window.addEventListener('load', startListening);
		
		// 窗口大小变化时更新状态
		window.addEventListener('resize', updateStatus);
	</script>
</body>
</html>
