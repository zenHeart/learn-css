<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Document</title>
        <style>
            /* 非相邻兄弟元素 */
            p ~ p {
                background: yellow;
            }
            /* 必须相邻元素 */
            p + p {
                background: cyan;
            }
        </style>
    </head>

    <body>
        <h2>相邻兄弟选择器</h2>
        <div>
            <p>第一行</p>
            <p>第二行</p>
        </div>
        <div>
            <p>第一行</p>
            <div>demo</div>
            <p>第二行</p>
        </div>
    </body>
</html>
