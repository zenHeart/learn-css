<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Document</title>
        <style>
            a[href*='test' i] {
                color: red;
            }
            a[href*='test'] {
                border: 1px solid #000;
            }
        </style>
    </head>
    <body>
        <h2>i 忽略大小写</h2>
        <ul>
            <li>
                <a href="http://baidu.com?q=TEST"> 百度搜索 TEST</a>
            </li>
            <li><a href="http://baidu.com?q=test"> 百度搜索 test</a></li>
        </ul>
    </body>
</html>
