<h2>transition-property 控制动画作用的属性</h2>

<h2>默认为 all</h2>
<div class="box">
</div>

<h2>支持设置多个属性值</h2>
<div class="box multi">
</div>

<h2>支持自定义属性值</h2>
<div class="box custom">
</div>

<style> 
.box {
  width: 100px;
  height: 100px;
  display: inline-block;
  background: black;
  transition-duration: 1s;
}
.box:hover {
  background: greenyellow;
  transform: rotate(360deg);
  width: 50px;
  height: 50px;
}
.box.multi {
  transition-property: background, width;
}
.box.custom {
  /* 非法值会被忽略 */
  transition-property: b,background, a,width,height;
}

</style>
