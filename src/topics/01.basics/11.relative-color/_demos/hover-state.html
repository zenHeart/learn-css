<h1>悬停/激活状态</h1>
<p>基于相对颜色自动生成悬停和激活状态</p>
<style>
  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  
  :root {
    --primary: oklch(55% 0.2 245);
  }
  
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  
  .btn-primary:hover {
    background: oklch(from var(--primary) calc(L + 0.12) c h);
  }
  
  .btn-primary:active {
    background: oklch(from var(--primary) calc(L - 0.1) c h);
    transform: scale(0.98);
  }
  
  .btn-secondary {
    background: oklch(from var(--primary) calc(L + 0.3) c h);
    color: oklch(from var(--primary) 20% c h);
  }
  
  .btn-secondary:hover {
    background: oklch(from var(--primary) calc(L + 0.38) c h);
  }
  
  .btn-secondary:active {
    background: oklch(from var(--primary) calc(L + 0.25) c h);
    transform: scale(0.98);
  }
  
  .btn-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
</style>

<div class="btn-group">
  <button class="btn btn-primary">Primary Normal</button>
  <button class="btn btn-primary">Primary Hover Me</button>
  <button class="btn btn-primary">Primary Click</button>
</div>
<div class="btn-group">
  <button class="btn btn-secondary">Secondary Normal</button>
  <button class="btn btn-secondary">Secondary Hover Me</button>
  <button class="btn btn-secondary">Secondary Click</button>
</div>
