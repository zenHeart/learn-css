<h1>主题色阶生成</h1>
<p>基于单一颜色自动生成完整色阶</p>
<style>
  :root {
    --brand: oklch(55% 0.2 245);
  }
  
  .palette {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: 600px;
  }
  
  .swatch {
    width: 60px;
    height: 60px;
    border-radius: 6px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
    font-size: 10px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  
  .swatch-50 { background: oklch(from oklch(55% 0.2 245) calc(L + 0.4) calc(c * 0.3) h); }
  .swatch-100 { background: oklch(from oklch(55% 0.2 245) calc(L + 0.35) calc(c * 0.5) h); }
  .swatch-200 { background: oklch(from oklch(55% 0.2 245) calc(L + 0.25) calc(c * 0.7) h); }
  .swatch-300 { background: oklch(from oklch(55% 0.2 245) calc(L + 0.15) calc(c * 0.85) h); }
  .swatch-400 { background: oklch(from oklch(55% 0.2 245) calc(L + 0.07) calc(c * 1.1) h); }
  .swatch-500 { background: oklch(55% 0.2 245); }
  .swatch-600 { background: oklch(from oklch(55% 0.2 245) calc(L - 0.07) calc(c * 1.15) h); }
  .swatch-700 { background: oklch(from oklch(55% 0.2 245) calc(L - 0.15) calc(c * 1.1) h); }
  .swatch-800 { background: oklch(from oklch(55% 0.2 245) calc(L - 0.23) calc(c * 0.95) h); }
  .swatch-900 { background: oklch(from oklch(55% 0.2 245) calc(L - 0.31) calc(c * 0.8) h); }
</style>

<div class="palette">
  <div class="swatch swatch-50">50</div>
  <div class="swatch swatch-100">100</div>
  <div class="swatch swatch-200">200</div>
  <div class="swatch swatch-300">300</div>
  <div class="swatch swatch-400">400</div>
  <div class="swatch swatch-500">500</div>
  <div class="swatch swatch-600">600</div>
  <div class="swatch swatch-700">700</div>
  <div class="swatch swatch-800">800</div>
  <div class="swatch swatch-900">900</div>
</div>
