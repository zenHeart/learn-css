<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
    .parent {
        height: 1000px;
        border: 1px solid #000;
        position: relative;
    }
    .button {
        position:sticky;
        bottom:40px;
        margin-top:20px;
    }
    </style>
</head>
<body>
    <h1>在顶部,移动变到底部</h1>
    <div class="parent">
        <div style="height: 800px"></div>
        <p class="button">button</p>
    </div>
</body>
</html>
