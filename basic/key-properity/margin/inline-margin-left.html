<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
    <style>
      span {
        border: 1px solid #000;
      }
      .children1 {
        margin-right: 1rem;
      }

      .children2 {
        margin-left: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>内联元素左右外边距不重叠</h1>
    <div class="container">
      <p><span class="children1">1</span><span class="children2">2</span></p>
    </div>
  </body>
</html>
