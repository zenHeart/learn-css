<h1>使用 js 控制暗黑切换</h1>
<style>
  :root {
    background: var(--background, #fff);
    color: var(--color, #2f2f2f)
  }
</style>

<div>
  <p>
    <label for="theme">暗黑模式</label>
    <input name="theme" type="checkbox"></input></p>
  <h1>标题</h1>
  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Magnam mollitia, tempore quam, blanditiis consectetur
    natus perspiciatis sint consequuntur itaque temporibus fugit? Laborum quam dolores mollitia placeat ad magnam?
    Distinctio, minus?</p>
</div>
<script>
  let bodyStyle = document.documentElement.style;
  let input = document.getElementsByTagName('input')[0];
  input.onclick = function (e) {
    let isDark = e.target.checked;

    if (isDark) {
      bodyStyle.setProperty('--background', '#2f2f2f')
      bodyStyle.setProperty('--color', '#fff')
    } else {
      bodyStyle.setProperty('--background', '#fff')
      bodyStyle.setProperty('--color', '#2f2f2f')

    }
    console.log('properties:', getComputedStyle(document.documentElement))
  }
</script>
