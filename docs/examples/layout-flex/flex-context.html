<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Document</title>
</head>

<body>
	<h1>验证 flex 容器对资源素行为的更改</h1>
	<p>
		<strong>flex 布局改变了块级子元素的默认特性</strong>
		<ol>
			<li>元素在主轴上的宽度收缩为内容大小</li>
			<li>元素在纵轴上自动拉伸</li>
			<li>元素在主轴上设置的宽度失效</li>
			<li>元素在纵轴上设置的有效</li>
		</ol>
	</p>
	<div class="column">
		<div class="item">1</div>
		<div class="item">2</div>
		<div class="item">3</div>
		<div class="item">4</div>
	</div>
	<style>
		.column {
			display: flex;
			border: 1px solid green;
		}

		.item {
			width: 50%;
			background: yellow;
		}

		.item:nth-child(1) {}

		.item:nth-child(2n) {
			background: cyan;
		}
	</style>
</body>

</html>
