<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>currentColor</title>
    <style type="text/css">
      .container {
        /* 默认为黑色 */
        background: currentColor;
      }
      p {
        color: gold;
        /* 当设置颜色后继承当前颜色 */
        border: 1px solid currentColor;
      }
      span {
        padding: 1rem;
        color: greenyellow;
        /* 当设置颜色后继承当前颜色 */
        border: 1px solid currentColor;
      }
    </style>
  </head>
  <body style="position: relative">
    <h1>currentColor 表示当前的颜色</h1>
    <div class="container">
      <p><span>test</span></p>
    </div>
  </body>
</html>
