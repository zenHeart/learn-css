<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>验证 float 塌陷</title>
        <style>
            .container {
                border: 1px solid #000;
                position: relative;
            }
            .children {
                float: left;
                padding: 10px;
            }
            select[name='position'] {
                margin-bottom: 10px;
            }
            p {
                background: yellow;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <img class="children" src="https://dummyimage.com/100x100/green" />
            <p>
                注意内容区域会在浮动元素之后排列,但是由于浮动不占据父容器空间,
                所以该 p 标签的对应的盒模型和浮动元素出现了重叠。
            </p>
        </div>
    </body>
    <script></script>
</html>
