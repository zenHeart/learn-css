<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Document</title>
        <style>
            .panel {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .controller {
                flex: 1;
                border: 1px solid #000;
                margin-right: 10px;
                padding: 10px;
                margin-bottom: 200px;
            }
            .result {
                margin: 20px;
                position: relative;
                flex: 0 0 300px;
                width: 300px;
                padding: 10px;
                border: 1px solid #000;
            }
            #target {
                position: absolute;
                top: 0px;
                bottom: 0px;
                left: 0px;
                right: 0px;
                background: cyan;
                opacity: 0.5;
            }
            .x-axis {
                position: absolute;
                left: -50%;
                right: -50%;
                top: 50%;
                height: 1px;
                border-radius: 0.5px;
                font-size: 0;
                background: red;
            }
            .x-axis::after {
                position: absolute;
                display: inline-block;
                top: -6px;
                right: 0;
                font-size: 12px;
                line-height: 12px;
                height: 12px;
                content: '>';
                color: red;
            }
            .y-axis {
                position: absolute;
                left: 50%;
                top: -50%;
                bottom: -50%;
                width: 2px;
                border-radius: 0.5px;
                font-size: 0;
                background: red;
            }
            .y-axis::before {
                position: absolute;
                display: inline-block;
                left: -6px;
                top: -6px;
                font-size: 12px;
                line-height: 12px;
                height: 12px;
                width: 12px;
                content: '>';
                color: red;
                transform: rotate(-90deg);
            }
        </style>
    </head>
    <body>
        <h1>demo to show how to sue transform</h1>
        <div class="panel">
            <div class="controller">
                <form name="transform">
                    <div>
                        <label for="rotate"
                            >rotate: <span data-rotate="0"></span
                        ></label>
                        <input
                            min="-180"
                            max="180"
                            step="1"
                            name="rotate"
                            type="range"
                        />
                    </div>
                    <div>
                        <label>origin(设置原点):</label>
                        <input name="origin-x" type="number" />px
                        <input name="origin-y" type="number" />px
                    </div>
                </form>
            </div>
            <div class="result">
                <div class="x-axis"></div>
                <div class="y-axis"></div>
                <div id="target">
                    content
                </div>
            </div>
        </div>
        <script>
            let config = {
                rotate: {
                    val: [0],
                    inputEle: [document.querySelector('input[name="rotate"]')],
                    outputEle: document.querySelector('span[data-rotate]'),
                    unit: 'deg',
                    styleKey: 'transform',
                    update(key, item) {
                        item.val = item.inputEle.map(ele => ele.value);
                        item.outputEle.innerText = `${item.val}${item.unit}`;
                        target.style[
                            item.styleKey
                        ] = `${key}(${item.val}${item.unit})`;
                    },
                    init(key, item) {
                        item.inputEle.forEach(ele => {
                            ele.onchange = item.update.bind(this, key, item);
                        });
                    },
                },
                origin: {
                    val: [0, 0],
                    inputEle: [
                        document.querySelector('input[name="origin-x"]'),
                        document.querySelector('input[name="origin-y"]'),
                    ],
                    unit: 'px',
                    styleKey: 'transform-origin',
                    outputEle: [
                        document.querySelector('.x-axis'),
                        document.querySelector('.y-axis'),
                    ],
                    update(key, item) {
                        item.val = item.inputEle.map(ele => ele.value);
                        (target.style[item.styleKey] = item.val.map(
                            val => val + 'px'
                        )).join(' ');
                        item.outputEle[0].style.top = `calc( ${item.val[0]}px )`;
                        item.outputEle[1].style.left = `calc( ${item.val[1]}px  )`;
                    },
                    init(key, item) {
                        item.inputEle.forEach(ele => {
                            ele.onchange = item.update.bind(this, key, item);
                        });
                    },
                },
            };
            let target = document.getElementById('target');
            let inputs = document.querySelectorAll('input');

            init();

            function init() {
                Object.keys(config).forEach(key => {
                    let item = config[key];
                    item.init(key, item);
                });
            }
        </script>
    </body>
</html>
