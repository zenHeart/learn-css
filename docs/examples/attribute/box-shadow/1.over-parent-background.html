<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .parent {
          background: gray;
        }
        .children {
          border-radius: 20px;
          border: 1px solid red;
          box-shadow: inset 100vw 0 white;
        }
    </style>
  </head>
  <body>
    <h1>利用 box-shadow 覆盖父元素背景</h1>
    <div class="parent">
      <div class="children">
        <p>test</p>
      </div>
    </div>
  </body>
</html>
