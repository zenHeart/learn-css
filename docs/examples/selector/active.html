<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>active</title>
    <style>
      .b1:active::after {
        content: url(https://httpbin.org/get?id=bt1);
        display: none;
      }
      .b2:active::after {
        content: url(https://httpbin.org/get?id=bt2);
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>使用 active 触发锚点</h2>
    <div>
      <button class="b1">点击触发锚点 1</button>
      <button class="b2">点击触发锚点 2</button>
    </div>
  </body>
</html>
