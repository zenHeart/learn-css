<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Document</title>
        <style>
            /* 选中某种类型的元素,会忽略子元素中插入的其他元素 */
            p:nth-of-type(2n) {
                background: cyan;
            }
        </style>
    </head>
    <body>
        <h2>:nth-of-type() 实现特定类型子元素的选中</h2>
        <ul>
            <p>
                Lorem ipsum dolor sit amet.
                <span>demo</span>
            </p>
            <div>demo</div>
            <p>
                Lorem ipsum dolor sit amet.
                <span>demo</span>
            </p>
        </ul>
    </body>
</html>
