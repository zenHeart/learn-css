<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <button class="notransition">notransition</button>
  <button class="active">active</button>
  <style>
    html,body {
      background: black;
      color: white;
      height: 100%;
    }
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      border: 1px solid cyan;
    }
    .loading>div {
      transition: transform 2s;
      transform: translateX(-60vw);
    }
    .loading.active>div {
      transform: translateX(0) rotate(360deg);
    }
    .notransition>div {
      -webkit-transition: none !important;
      -moz-transition: none !important;
      -o-transition: none !important;
      -ms-transition: none !important;
      transition: none !important;
    }


  </style>
</head>
<body>
  <div class="loading">
      <div style="transition-delay: 1.4s;">l</div>
      <div style="transition-delay: 1.2s;">o</div>
      <div style="transition-delay: 1.0s;">a</div>
      <div style="transition-delay: 0.8s;">d</div>
      <div style="transition-delay: 0.6s;">i</div>
      <div style="transition-delay: 0.4s;">n</div>
      <div style="transition-delay: 0.2s;">g</div>
  </div>
</body>
<script>
  let button = document.getElementsByTagName('button');
  let el = document.getElementsByClassName('loading')[0];
  button[0].onclick = () =>  el.classList.toggle('notransition')
  button[1].onclick = () =>  el.classList.toggle('active')
</script>
</html>
